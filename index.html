<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#fdba3b" />
  <meta name="description" content="ImagiFix — a fast, offline-capable photo editor built with pure HTML, CSS and Vanilla JavaScript using the Canvas API." />

  <title>ImagiFix — Photo Editor</title>

  <link rel="stylesheet" href="css/main.css" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="assets/images/favicon.ico" type="image/x-icon" />
  <link rel="apple-touch-icon" href="assets/images/logo-192.png" />
</head>

<body>
  <!-- ===== Header ===== -->
  <header class="app-header">
    <h1 class="app-header__title" id="title">ImagiFix</h1>

    <div class="app-header__actions">
      <input type="file" id="fileInput" accept="image/*" class="visually-hidden" />
      <label for="fileInput" class="btn btn--primary">Choose Image</label>

      <button type="button" id="undoButton" class="icon-btn" aria-label="Undo (Ctrl+Z)" title="Undo (Ctrl+Z)" data-icon="undo"></button>
      <button type="button" id="redoButton" class="icon-btn" aria-label="Redo (Ctrl+Y)" title="Redo (Ctrl+Y)" data-icon="redo"></button>

      <button type="button" id="saveButton" class="btn btn--primary btn--save" aria-label="Save image (Ctrl+S)" title="Save image (Ctrl+S)">
        <span class="btn__label">Save</span>
        <span class="btn__icon" data-icon="download"></span>
      </button>
    </div>
  </header>

  <!-- ===== Editor ===== -->
  <main class="editor">
    <!-- Tool rail -->
    <nav class="sidebar" aria-label="Editing tools">
      <button type="button" id="toolbarToggle" class="tool-btn" aria-label="Toggle adjustments" aria-controls="toolbar" title="Adjustments" data-icon="sliders"></button>
      <button type="button" id="cropButton" class="tool-btn" aria-label="Crop" aria-pressed="false" title="Crop" data-icon="crop"></button>
      <button type="button" id="rotateLeftButton" class="tool-btn" aria-label="Rotate left (Shift+R)" title="Rotate left" data-icon="rotateLeft"></button>
      <button type="button" id="rotateRightButton" class="tool-btn" aria-label="Rotate right (R)" title="Rotate right" data-icon="rotateRight"></button>
      <button type="button" id="flipHButton" class="tool-btn" aria-label="Flip horizontal (H)" aria-pressed="false" title="Flip horizontal" data-icon="flipHorizontal"></button>
      <button type="button" id="flipVButton" class="tool-btn" aria-label="Flip vertical (V)" aria-pressed="false" title="Flip vertical" data-icon="flipVertical"></button>

      <div class="text-tool">
        <button type="button" id="textButton" class="tool-btn" aria-label="Add text" aria-haspopup="dialog" title="Add text" data-icon="text"></button>

        <div class="text-panel" id="textPanel" role="dialog" aria-label="Add text overlay">
          <button type="button" id="textCloseButton" class="text-panel__close" aria-label="Close">&times;</button>
          <label class="text-panel__label" for="textContent">Text</label>
          <input type="text" id="textContent" placeholder="Enter text…" autocomplete="off" />
          <div class="text-panel__row">
            <label for="textColor">Colour</label>
            <input type="color" id="textColor" value="#000000" />
          </div>
          <div class="text-panel__row">
            <label for="textSize">Size</label>
            <input type="range" id="textSize" class="range" min="4" max="120" value="24" />
            <output id="textSizeValue" for="textSize">24</output>
          </div>
          <button type="button" id="addTextButton" class="btn btn--primary">Add Text</button>
        </div>
      </div>
    </nav>

    <!-- Adjustments -->
    <aside class="toolbar" id="toolbar" aria-label="Adjustments">
      <div id="filterControls" class="toolbar__filters"><!-- generated from FILTERS config --></div>
      <button type="button" id="resetButton" class="btn">Reset Adjustments</button>
    </aside>

    <!-- Canvas -->
    <section class="canvas-area" aria-label="Image preview">
      <div id="toast" class="toast" role="status" aria-live="polite"></div>
      <canvas id="canvas" width="980" height="600" role="img" aria-label="Editing canvas"></canvas>
    </section>
  </main>

  <!-- ===== Install prompt ===== -->
  <div class="install-popup" id="installPopup" role="dialog" aria-label="Install ImagiFix" aria-hidden="true">
    <div class="install-popup__card">
      <h2 class="install-popup__title">Install ImagiFix?</h2>
      <p class="install-popup__text">Add it to your device for one-tap access and full offline editing.</p>
      <div class="install-popup__actions">
        <button type="button" id="installButton" class="btn btn--primary">Install</button>
        <button type="button" id="dismissButton" class="btn">Dismiss</button>
      </div>
    </div>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
